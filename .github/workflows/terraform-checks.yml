name: Terraform Checks and AWS Resources

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform-checks:
    name: Validate ${{ matrix.resource }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        resource: [s3, ec2, vpc, alb, route53, lambda, aurora]

    defaults:
      run:
        working-directory: aws-resources/${{ matrix.resource }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Show repository and resource files
        working-directory: .
        run: |
          echo "===== REPOSITORY FILE TREE ====="
          find . -maxdepth 5 -type f ! -path './.git/*' | sort
          echo "===== CURRENT AWS RESOURCE ====="
          find "aws-resources/${{ matrix.resource }}" -maxdepth 4 -type f | sort

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform without backend
        run: terraform init -backend=false

      - name: Validate Terraform configuration
        run: terraform validate

      - name: Show Terraform providers
        run: terraform providers

      - name: Inventory resources, data sources, variables and outputs
        shell: bash
        run: |
          echo "===== RESOURCE BLOCKS ====="
          grep -RInE '^resource[[:space:]]+"' --include='*.tf' . || true
          echo "===== DATA SOURCE BLOCKS ====="
          grep -RInE '^data[[:space:]]+"' --include='*.tf' . || true
          echo "===== INPUT VARIABLES ====="
          grep -RInE '^variable[[:space:]]+"' --include='*.tf' . || true
          echo "===== OUTPUT DEFINITIONS ====="
          grep -RInE '^output[[:space:]]+"' --include='*.tf' . || true

      - name: Show Terraform dependency graph
        shell: bash
        run: |
          echo "===== TERRAFORM GRAPH (DOT FORMAT) ====="
          terraform graph -type=plan | head -n 100

      - name: Inspect state when available
        shell: bash
        run: |
          if [ -f terraform.tfstate ]; then
            terraform state list
            terraform show -no-color
            terraform output
          else
            echo "No terraform.tfstate found; state inspection is skipped."
            echo "This validation workflow does not create AWS resources."
          fi
