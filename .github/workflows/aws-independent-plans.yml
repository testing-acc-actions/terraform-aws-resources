name: AWS Terraform Plans - Independent Resources

on:
  workflow_dispatch:
    inputs:
      bucket_name:
        description: "Globally unique S3 bucket name for the plan (lowercase letters, numbers and hyphens)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  terraform-plan:
    name: Plan ${{ matrix.folder }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        folder: [s3, ec2, vpc, lambda]

    defaults:
      run:
        working-directory: ${{ matrix.folder }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWSACCESSKEYID }}
          aws-secret-access-key: ${{ secrets.AWSACCESSKEY }}
          aws-region: ap-south-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Check Terraform formatting (no file changes)
        run: terraform fmt -check -recursive

      - name: Initialize Terraform without backend
        run: terraform init -backend=false -input=false

      - name: Validate Terraform configuration
        run: terraform validate

      - name: Show Terraform providers
        run: terraform providers

      - name: Create Terraform plan (no deployment)
        env:
          TF_VAR_bucket_name: ${{ inputs.bucket_name }}
        run: terraform plan -input=false -no-color
